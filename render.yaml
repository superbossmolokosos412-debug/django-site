databases:
  - name: django-db
    databaseName: mydb
    user: myuser
    plan: free
    region: frankfurt

services:
  - type: web
    name: django-app
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "./build.sh"
    startCommand: "gunicorn myproject.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: django-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.13"
      - key: DEBUG
        value: "False"
